[project]
name = "wiki-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over Wikipedia philosophy articles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "httpx>=0.27",
    "numpy>=2",
]

[project.scripts]
wiki-rag = "wiki_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# app.py is the original single-file prototype; it is replaced once the new pipeline lands.
extend-exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
